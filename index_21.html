<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market scanner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14202e;--mute:#5d6b7c;--line:#d8dee6;--long:#0b7a66;--short:#b0243f;--chip:#e3e8ee;--e20:#2f6fdb;--e50:#d98a12;--e200:#8a4fd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--panel:#17212c;--ink:#e6ecf2;--mute:#92a1b2;--line:#27343f;--long:#34c3a5;--short:#ff6b85;--chip:#22303c;--e20:#6aa2ff;--e50:#f0b04a;--e200:#b88cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--panel:#17212c;--ink:#e6ecf2;--mute:#92a1b2;--line:#27343f;--long:#34c3a5;--short:#ff6b85;--chip:#22303c;--e20:#6aa2ff;--e50:#f0b04a;--e200:#b88cff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button,label.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,summary:focus-visible,label.btn:focus-within{outline:2px solid var(--long);outline-offset:2px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr 170px;gap:8px 14px;align-items:center;padding:14px 16px}
summary::-webkit-details-marker{display:none}
.sym{font-weight:800;font-size:18px}
.mk{color:var(--mute);font-size:13px;margin-left:8px}
.sig{display:block;font-weight:800;font-size:15px;margin-top:2px}
.sig.long{color:var(--long)}.sig.short{color:var(--short)}.sig.mixed{color:var(--mute);font-weight:600}
svg.ch{width:170px;height:56px;display:block}
svg.ch polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
svg.ch .p{stroke:var(--ink)}svg.ch.long .p{stroke:var(--long)}svg.ch.short .p{stroke:var(--short)}svg.ch .f{stroke:var(--e20);stroke-width:1.5}svg.ch .s{stroke:var(--e50);stroke-width:1.5}svg.ch .t{stroke:var(--e200);stroke-width:1.5}svg.ch circle{fill:var(--ink)}svg.ch.long circle{fill:var(--long)}svg.ch.short circle{fill:var(--short)}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin:-4px 0 12px}.key i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
svg.ch polyline{fill:none!important}
.chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--mute)}
.chip.up{color:var(--long);background:color-mix(in srgb,var(--long) 14%,transparent)}
.chip.down{color:var(--short);background:color-mix(in srgb,var(--short) 14%,transparent)}
.rank{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px}.rank[hidden]{display:none}.rank h2{font-size:15px;margin:0 0 8px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.rank h2 button{padding:3px 10px;font-size:13px;margin-left:4px}.rk{display:grid;grid-template-columns:44px 1fr 60px;gap:8px;align-items:center;font-size:14px;margin:4px 0}.rk .tr{position:relative;height:8px;background:var(--chip);border-radius:4px}.rk .tr b{position:absolute;top:0;height:8px;border-radius:4px}.rk .tr i{position:absolute;left:50%;top:-2px;width:1px;height:12px;background:var(--mute)}.rk .v{text-align:right;color:var(--mute)}
.det{padding:0 16px 14px;color:var(--mute);font-size:14px}
.det p{margin:4px 0}
.det b{color:var(--ink);font-weight:600}
.empty{color:var(--mute);padding:20px 0}
.more{margin-top:20px;color:var(--mute);font-size:14px}
.more summary{display:block;padding:0;font-weight:600;color:var(--ink)}
.eb{position:relative;height:8px;background:var(--chip);border-radius:4px}.eb b{position:absolute;top:0;height:8px;border-radius:4px}.eb i{position:absolute;left:50%;top:-2px;width:1px;height:12px;background:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:16px}
.cotrow{padding:12px 16px}.cothead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.cotnet{color:var(--mute);font-size:13px}.cotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.cc{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--mute)}.cc b{display:block;font-size:15px;font-weight:800;color:var(--ink)}.cc b.up{color:var(--long)}.cc b.down{color:var(--short)}.cotrow .chips{margin-top:8px}.cotctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:10px}.cotctl .bar{margin:0}.cotctl span.lb{font-size:13px;color:var(--mute)}.cotbar{display:grid;grid-template-columns:1fr 74px;gap:10px;align-items:center;margin-top:10px}.cotov{font-weight:800;font-size:14px;text-align:right}.cotov.up{color:var(--long)}.cotov.down{color:var(--short)}.cotlab{font-size:12px;color:var(--mute);margin-top:2px}.eb.mb{height:6px;margin-top:6px}.eb.mb b{height:6px}.eb.mb i{top:-2px;height:10px}
</style>
</head>
<body>
<main>
<h1>Market scanner</h1>
<p class="sub" id="stamp"></p>
<div class="bar" id="tabs"><button data-t="scan" aria-pressed="true">Scanner</button><button data-t="econ" aria-pressed="false">Economy</button><button data-t="cot" aria-pressed="false">COT</button></div>
<div id="scanview">
<div class="rank" id="dxy" hidden></div>
<div class="rank" id="rank" hidden></div>
<div class="bar" id="filters">
  <button data-m="All" aria-pressed="true">All</button>
  <button data-m="Forex" aria-pressed="false">Forex</button>
  <button data-m="Metals" aria-pressed="false">Metals</button>
  <button data-m="Futures" aria-pressed="false">Futures</button>
  <button data-m="Crypto" aria-pressed="false">Crypto</button>
  <button id="al" aria-pressed="false">Signals only</button>
</div>
<div class="key"><span>Price line:</span><span><i style="background:var(--long)"></i>Long</span><span><i style="background:var(--short)"></i>Short</span><span><i style="background:var(--ink)"></i>Mixed</span><span><i style="background:var(--e20)"></i>20 EMA</span><span><i style="background:var(--e50)"></i>50 EMA</span><span><i style="background:var(--e200)"></i>200 EMA</span></div>
<div id="list"></div>


</div>
<div id="econview" hidden></div>
<div id="cotview" hidden></div>
</main>
<script>
var T=[40,60],M=25,N=3,CH=1,W_TREND=40,W_MACRO=25,W_STRENGTH=20,W_COT=15,STRONG_AT=85,NORMAL_AT=55,mk="All",only=false,data;
function wk(seed,drift){var p=100,a=[];for(var i=0;i<120;i++){p+=drift+Math.sin(i*seed*3.7)*1.4+Math.cos(i*seed)*0.8;a.push(p)}return a}
var D=[["EURUSD","Forex","bull",9,1.0842,98450,6200,81,48,1.9,1.2],["GBPUSD","Forex","bull",31,1.2715,21300,-1800,64,22,0.9,0.4],
["USDJPY","Forex","bear",4,149.12,-48000,-5200,22,-55,4.1,2.8],["XAUUSD","Metals","bull",58,2338.4,171000,3100,55,35,"US real 10y 1.85%"],
["AUDUSD","Forex","bear",17,0.6571,-31000,900,47,-12,-0.6,-0.9],["ES","Futures","bull",44,5312.5,-18500,-9400,28,18,"US real 10y 1.85%"],
["NQ","Futures","bull",12,18640,52000,4100,72,41,"US real 10y 1.85%"],["YM","Futures","bear",6,39280,-6200,-1100,35,-30,"US real 10y 1.85%"],
["CL","Futures","bear",22,77.8,240000,12000,69,null]];
var DEMO={generated:"sample",rows:D.map(function(d,i){var r={symbol:d[0],market:d[1],state:d[2],since:d[3],price:d[4],cot_net:d[5],cot_change:d[6],cot_pct:d[7],macro_score:d[8],
chart:wk(i+2,d[2]=="bull"?0.15:-0.15),cot_change_1m:d[6]*3,cot_change_3m:d[6]*7,cot_z_1w:d[6]>0?0.8:d[6]<0?-0.8:0,cot_z_1m:d[6]>0?1.1:d[6]<0?-1.1:0,cot_z_3m:d[6]>0?1.0:d[6]<0?-1.0:0};if(typeof d[9]=="string")r.note=d[9];else if(d[9]!=null){r.rate_diff=d[9];r.real_diff=d[10]}return r})};
data=DEMO;DEMO.strength={d1:{USD:0.31,NZD:0.26,AUD:0.2,GBP:0.12,EUR:-0.05,CAD:-0.18,CHF:-0.22,JPY:-0.44},d5:{USD:0.9,GBP:0.55,EUR:0.2,AUD:0.1,NZD:-0.1,CAD:-0.35,CHF:-0.6,JPY:-0.7}};
function tdir(r){return r.state=="bull"?1:-1}
function cdir(r){var s=r.cot_share!=null?r.cot_share:(r.cot_pct>=T[1]?99:r.cot_pct<=T[0]?-99:0);return s>=N?1:s<=-N?-1:0}
function cmom(r){if(r.cot_z_1m==null)return null;var w=[["1w",.2],["1m",.4],["3m",.4]],s=0,z=[];w.forEach(function(x){var v=r["cot_z_"+x[0]];if(v==null)return;s+=x[1]*Math.max(-1,Math.min(1,v/2));z.push(v)});var agree=z.every(function(v){return v>0})||z.every(function(v){return v<0});return agree?s:s*.5}
function cpos(r){var p=(r.cot_pct-50)/50;return r.cot_share==null?p:.5*Math.tanh(r.cot_share/15)+.5*p}
function ccrowd(r){return r.cot_pct>=90?1:r.cot_pct<=10?-1:0}
function cscore(r){var m=cmom(r);if(m==null)return cdir(r);var s=.6*cpos(r)+.4*m,c=ccrowd(r);if(c&&s*c>0)s*=.7;return Math.max(-1,Math.min(1,s))}
function cdx(r){var s=cscore(r);return s>=.25?1:s<=-.25?-1:0}
function sdir(r){return r.strength_gap==null?0:r.strength_gap>=4?1:r.strength_gap<=-4?-1:0}
function ctxt(r){var m=cmom(r);if(m!=null){var d=cdx(r),b=d==1?"COT bullish":d==-1?"COT bearish":"COT neutral";if(Math.abs(m)>=.25)b+=d?(m*d>0?", building":", fading"):(m>0?", turning up":", turning down");return b}return ctxtOld(r)}
function ctxtOld(r){var d=cdir(r);if(!d)return"COT neutral";var base="COT "+(d==1?"long":"short"),oi=r.cot_share?Math.abs(r.cot_net/(r.cot_share/100)):0;if(!oi)return base;var c=r.cot_change/oi*100;if(Math.abs(c)<CH)return base;return base+(c*d>0?", growing":", shrinking")}
function mdir(r){return r.macro_score==null?null:r.macro_score>=M?1:r.macro_score<=-M?-1:0}
function score(r){return W_TREND*tdir(r)+W_COT*cscore(r)+W_MACRO*(mdir(r)||0)+W_STRENGTH*sdir(r)}
function sig(r){var s=sig0(r);s.v=s.k=="mixed"?0:Math.abs(score(r))*(s.k=="long"?1:-1);return s}
function sig0(r){var t=tdir(r),sc=score(r);if(sc==0||(sc>0)!=(t>0))return{k:"mixed",n:0,t:"Mixed"};var k=t==1?"long":"short",a=Math.abs(sc);
  return a>=STRONG_AT?{k:k,n:3,t:"Strong "+k}:a>=NORMAL_AT?{k:k,n:2,t:k=="long"?"Long":"Short"}:{k:k,n:1,t:"Weak "+k}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fmt(n){return (n>0?"+":n<0?"\u2212":"")+Math.abs(n).toLocaleString()}
function chip(txt,d){return el("span","chip"+(d==1?" up":d==-1?" down":""),txt)}
function ema(v,n){var k=2/(n+1),o=[],p=v[0];v.forEach(function(x){p=x*k+p*(1-k);o.push(p)});return o}
function chart(r){var NS="http://www.w3.org/2000/svg",v=r.chart,e20=r.ema20||ema(v,20),e50=r.ema50||ema(v,50),e200=r.ema200||ema(v,200),w=170,h=56,all=v.concat(e20,e50),lo=Math.min.apply(0,all),hi=Math.max.apply(0,all),rg=(hi-lo)||1;
  function pts(a){return a.map(function(y,i){return (i/(a.length-1)*(w-8)+3).toFixed(1)+","+(h-4-(y-lo)/rg*(h-8)).toFixed(1)})}
  var s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 "+w+" "+h);s.setAttribute("class","ch "+r.s.k);s.setAttribute("role","img");s.setAttribute("aria-label","4 hour price with 20 and 50 EMA");
  [[e200,"t"],[e50,"s"],[e20,"f"],[v,"p"]].forEach(function(x){var l=document.createElementNS(NS,"polyline");l.setAttribute("class",x[1]);l.setAttribute("points",pts(x[0]).join(" "));s.appendChild(l)});
  var e=pts(v).pop().split(","),c=document.createElementNS(NS,"circle");c.setAttribute("cx",e[0]);c.setAttribute("cy",e[1]);c.setAttribute("r",2.5);s.appendChild(c);return s}
var SW="d1";
function rankView(){var box=document.getElementById("rank"),st=data.strength;box.textContent="";if(!st||!st[SW]){box.hidden=true;return}box.hidden=false;
  var h=el("h2"),tg=el("span");h.appendChild(el("span",null,"Currency strength"));
  [["d1","24 hours"],["d5","5 days"]].forEach(function(o){var b=el("button",null,o[1]);b.setAttribute("aria-pressed",SW==o[0]);b.dataset.w=o[0];tg.appendChild(b)});h.appendChild(tg);box.appendChild(h);
  var v=st[SW],ks=Object.keys(v).sort(function(a,b){return v[b]-v[a]}),mx=Math.max.apply(0,ks.map(function(k){return Math.abs(v[k])}))||1;
  ks.forEach(function(k){var row=el("div","rk"),tr=el("div","tr"),b=el("b"),w=Math.abs(v[k])/mx*50;b.style.width=w+"%";if(v[k]>=0){b.style.left="50%";b.style.background="var(--long)"}else{b.style.left=(50-w)+"%";b.style.background="var(--short)"}
    tr.appendChild(b);tr.appendChild(el("i"));row.appendChild(el("span",null,k));row.appendChild(tr);row.appendChild(el("span","v",fmt(+v[k].toFixed(2))+"%"));box.appendChild(row)})}
document.getElementById("rank").addEventListener("click",function(e){var b=e.target.closest("button");if(b&&b.dataset.w){SW=b.dataset.w;rankView()}});
function usdSide(r){return r.market=="Forex"?(/^USD/.test(r.symbol)?1:/USD$/.test(r.symbol)?-1:0):0}
function stampView(){var s=document.getElementById("stamp");if(data.generated=="sample"){s.textContent="Sample data. Live results appear once the scanner has run.";s.style.color="";return}
  var g=new Date(data.generated),m=Math.max(0,Math.round((Date.now()-g)/60000)),ago=m<60?m+" min ago":(m/60).toFixed(1)+" hours ago",c=data.rows.filter(function(r){return r.cot_asof})[0];
  s.textContent="Updated "+g.toLocaleString()+" ("+ago+")"+(data.closed_only?". Closed 4H candles only.":".")+(c?" COT data as of "+c.cot_asof+".":"")+(m>120?" Scan looks stale.":"");s.style.color=m>120?"var(--short)":""}
function dxyView(){var box=document.getElementById("dxy"),x=data.dxy;box.textContent="";if(!x){box.hidden=true;return}box.hidden=false;
  var up=x.state=="bull",hrs=x.since*4,st=data.strength,h=el("h2");h.appendChild(el("span",null,"US dollar index (DXY)"));h.appendChild(el("span","sig "+(up?"long":"short"),up?"Bullish":"Bearish"));box.appendChild(h);
  var t=el("p","det0","20 EMA "+(up?"above":"below")+" 50 EMA, crossed "+(hrs<48?hrs+" hours":Math.round(hrs/24)+" days")+" ago."+(hrs<=24?" Just flipped.":""));t.style.margin="0";t.style.color="var(--mute)";box.appendChild(t);
  if(st&&st.d1&&st.d1.USD!=null&&(st.d1.USD>0)!=up&&Math.abs(st.d1.USD)>=0.1){var w=el("p",null,"Early warning: USD is "+(st.d1.USD>0?"gaining":"losing")+" strength over 24 hours ("+fmt(+st.d1.USD.toFixed(2))+"%), against the DXY trend.");w.style.margin="6px 0 0";w.style.color="var(--short)";w.style.fontWeight="600";box.appendChild(w)}}
function econView(){var box=document.getElementById("econview"),E=data.economy;box.textContent="";
  if(!E||!Object.keys(E).length){box.appendChild(el("p","empty","No economy data yet. It appears after the next scan."));return}
  box.appendChild(el("p","sub","Each currency's economy scored from -100 (weak) to +100 (strong), best first. A currency with releases in releases.csv from the last 30 days is scored from those alone, newer ones counting more. Until then it uses FRED data (growth, jobs, momentum) in the background. Tap a currency for the numbers."));
  var ks=Object.keys(E).sort(function(a,b){return (E[b].score==null?-999:E[b].score)-(E[a].score==null?-999:E[a].score)});
  ks.forEach(function(k){var c=E[k],sc=c.score,it=el("details","item"),sm=el("summary"),nm=el("div"),h=el("div"),kind=sc==null?"mixed":sc>=15?"long":sc<=-15?"short":"mixed";
    h.appendChild(el("span","sym",k));nm.appendChild(h);nm.appendChild(el("span","sig "+kind,sc==null?"No data":(sc>=15?"Strong":sc<=-15?"Weak":"Neutral")+" ("+fmt(sc)+")"));sm.appendChild(nm);
    var bar=el("div","eb"),b=el("b"),w=Math.abs(sc||0)/2;b.style.width=w+"%";if((sc||0)>=0){b.style.left="50%";b.style.background="var(--long)"}else{b.style.left=(50-w)+"%";b.style.background="var(--short)"}
    bar.appendChild(b);bar.appendChild(el("i"));sm.appendChild(bar);it.appendChild(sm);
    var d=el("div","det");
    function line(lbl,txt){var p=el("p");p.appendChild(el("b",null,lbl+": "));p.appendChild(document.createTextNode(txt));d.appendChild(p)}
    line("Source",c.source=="releases"?"your releases.csv (last 30 days). FRED data stays in the background and is used again once no recent releases are left.":"FRED data, because there are no releases for this currency in the last 30 days.");
    if(c.source!="releases"){line("Growth",c.growth?"real GDP "+fmt(c.growth.value)+"% year on year (data to "+c.growth.asof+", "+c.growth.series+"). Score "+fmt(c.growth.score)+"."+(c.growth.old?" This data is older than usual.":""):"not available.");
    line("Jobs",c.jobs?"unemployment "+c.jobs.value+"%, "+fmt(c.jobs.change)+" points over the last year (data to "+c.jobs.asof+", "+c.jobs.series+"). Score "+fmt(c.jobs.score)+"."+(c.jobs.old?" This data is older than usual.":""):"not available.");
    line("Momentum",c.momentum?(c.momentum.growth_accel!=null?"growth "+(c.momentum.growth_accel>=0?"sped up":"slowed")+" by "+Math.abs(c.momentum.growth_accel)+" points versus the previous reading. ":"")+(c.momentum.jobs_recent!=null?"Unemployment moved "+fmt(c.momentum.jobs_recent)+" points over the latest "+(c.momentum.jobs_recent==null?"":"3 months or quarter")+". ":"")+"Score "+fmt(c.momentum.score)+".":"not available.");}
    line("Surprises",c.surprise?"recent releases against forecast score "+fmt(c.surprise.score)+" out of \u00b11.":"none in the last 30 days. Add releases to releases.csv and they take over from the FRED data.");
    var R=data.rates&&data.rates[k];line("Rates",R?"short-term rate "+R.nom+"%, inflation "+R.infl+"%, real rate "+fmt(R.real)+"% (data to "+R.asof+", "+R.rate_series+" and "+R.cpi_series+")."+(R.old?" Some of this data is older than usual.":""):"not available, so pairs with this currency have no macro score.");
    if(c.source!="releases")line("Coverage",(c.n||0)+" inputs used. The score is based only on those.");
    it.appendChild(d);box.appendChild(it)})}
var CM="share",CP="all";
function cotv(r,p,m){return m=="share"?r["cot_sharechg_"+p]:(p=="1w"?r.cot_change:r["cot_change_"+p])}
function cotfmt(v,m){return v==null?"n/a":m=="share"?(v>0?"+":v<0?"\u2212":"")+Math.abs(v).toFixed(1)+" pts":fmt(v)}
function ord(n){var t=n%100,u=n%10;return n+(t>=11&&t<=13?"th":u==1?"st":u==2?"nd":u==3?"rd":"th")}
function bv(r,p){var v=r["cot_sharechg_"+p];return v!=null?v:cotv(r,p,"net")}
function comb(r){var a=["1w","1m","3m"].map(function(p){return bv(r,p)}).filter(function(x){return x!=null});return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function dbar(v,mx,cls){var bar=el("div",cls),b=el("b"),w=Math.min(50,Math.abs(v||0)/mx*50);b.style.width=w+"%";if((v||0)>=0){b.style.left="50%";b.style.background="var(--long)"}else{b.style.left=(50-w)+"%";b.style.background="var(--short)"}bar.appendChild(b);bar.appendChild(el("i"));return bar}
function cotView(){var box=document.getElementById("cotview");box.textContent="";
  var rows=data.rows.filter(function(r){return r.cot_net!=null});
  if(!rows.length){box.appendChild(el("p","empty","No COT data yet. It appears after the next scan."));return}
  var has=rows.some(function(r){return r.cot_change_1m!=null});
  box.appendChild(el("p","sub","How much each market\u2019s net speculator position (non-commercial) changed over the last week, month (4 reports) and quarter (13 reports). Green means more net long, red means less, which is bullish or bearish for the instrument as quoted (USDJPY, USDCAD and USDCHF are flipped). Ordered from the most green at the top to the most red at the bottom. The bars compare size, scaled to the biggest mover in each period. \u201cpts\u201d means percentage points of open interest. The COT score chip is the number the scanner tab uses (see below)."));
  if(!has)box.appendChild(el("p","note","Monthly and quarterly changes appear after the updated scanner has run. Until then only the weekly change is shown."));
  var ctl=el("div","cotctl");
  function grp(lbl,opts,cur,attr){var g=el("div","bar");g.appendChild(el("span","lb",lbl));opts.forEach(function(o){var b=el("button",null,o[1]);b.setAttribute("aria-pressed",cur==o[0]);b.dataset[attr]=o[0];g.appendChild(b)});ctl.appendChild(g)}
  grp("Show",[["share","% of open interest"],["net","Contracts"]],CM,"cm");
  grp("Order by",[["all","All three"],["1w","Week"],["1m","Month"],["3m","Quarter"]],CP,"cp");
  box.appendChild(ctl);
  function key(r){return CP=="all"?comb(r):(bv(r,CP)||0)}
  var P=[["1w","Week"],["1m","Month"],["3m","Quarter"]],mx={};
  ["all","1w","1m","3m"].forEach(function(p){mx[p]=Math.max.apply(0,rows.map(function(r){return Math.abs(p=="all"?comb(r):(bv(r,p)||0))}))||1});
  rows.slice().sort(function(a,b){return key(b)-key(a)}).forEach(function(r){
    var it=el("div","item cotrow"),hd=el("div","cothead"),nm=el("div");nm.appendChild(el("span","sym",r.symbol));nm.appendChild(el("span","mk",r.market));hd.appendChild(nm);
    hd.appendChild(el("span","cotnet","Net "+fmt(r.cot_net)+(r.cot_share!=null?" ("+fmt(r.cot_share)+"% of OI)":"")+" \u00b7 "+ord(r.cot_pct)+" percentile"));it.appendChild(hd);
    var k=key(r),ov=el("div","cotbar");ov.appendChild(dbar(k,mx[CP],"eb"));
    var lab=(CP=="all"?"Average of the three periods":P.filter(function(p){return p[0]==CP})[0][1]);
    ov.appendChild(el("span","cotov "+(k>0?"up":k<0?"down":""),(k>0?"+":k<0?"\u2212":"")+Math.abs(k).toFixed(1)+(r.cot_share!=null?" pts":"")));it.appendChild(ov);
    it.appendChild(el("div","cotlab",lab+(r.cot_share!=null?" (pts of open interest)":"")));
    var gr=el("div","cotgrid"),sg=[];
    P.forEach(function(p){var v=cotv(r,p[0],CM),c=el("div","cc");c.appendChild(document.createTextNode(p[1]));c.appendChild(el("b",v>0?"up":v<0?"down":"",cotfmt(v,CM)));c.appendChild(dbar(bv(r,p[0]),mx[p[0]],"eb mb"));gr.appendChild(c);var sv=cotv(r,p[0],"net");if(sv!=null)sg.push(sv)});
    it.appendChild(gr);
    var cc=el("div","chips"),cs=cscore(r);cc.appendChild(chip("COT score "+(cs>0?"+":"")+cs.toFixed(2),cdx(r)));
    if(sg.length==3&&sg.every(function(x){return x>0}))cc.appendChild(chip("Net position rising in all three periods",1));
    else if(sg.length==3&&sg.every(function(x){return x<0}))cc.appendChild(chip("Net position falling in all three periods",-1));
    it.appendChild(cc);
    box.appendChild(it)})}
document.getElementById("cotview").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.cm)CM=b.dataset.cm;if(b.dataset.cp)CP=b.dataset.cp;cotView()});
function render(){
  var rows=data.rows.map(function(r){return Object.assign({s:sig(r)},r)}).filter(function(r){return (mk=="All"||r.market==mk)&&(!only||r.s.n>=2)})
    .sort(function(a,b){return b.s.v-a.s.v||(b.macro_score||0)-(a.macro_score||0)});
  var L=document.getElementById("list");L.textContent="";
  if(!rows.length)L.appendChild(el("p","empty","No instruments match these filters."));

    var it=el("details","item"),sm=el("summary"),nm=el("div"),h=el("div");h.appendChild(el("span","sym",r.symbol));h.appendChild(el("span","mk",r.market));
    nm.appendChild(h);nm.appendChild(el("span","sig "+r.s.k,r.s.t));sm.appendChild(nm);
    if(r.chart&&r.chart.length>2)sm.appendChild(chart(r));else sm.appendChild(el("span"));
    var cp=el("div","chips"),m=mdir(r);
    cp.appendChild(chip(tdir(r)==1?"Trend up":"Trend down",tdir(r)));
    cp.appendChild(chip(ctxt(r),cdx(r)));
    cp.appendChild(chip(m==null?"Macro n/a":m==1?"Macro up":m==-1?"Macro down":"Macro neutral",m||0));if(r.cot_pct>=90||r.cot_pct<=10){var cm=cmom(r),sd=r.cot_pct>=90?1:-1;cp.appendChild(chip((r.cot_pct>=90?"Crowded long":"Crowded short")+(cm==null?"":cm*sd>.15?", still building":cm*sd<-.15?", unwinding":""),0))}if(r.strength_gap!=null){var g=r.strength_gap>=4?1:r.strength_gap<=-4?-1:0;cp.appendChild(chip(g==1?"Strength up":g==-1?"Strength down":"Strength neutral",g))}
    var u=usdSide(r);if(u&&data.dxy&&u*tdir(r)!=(data.dxy.state=="bull"?1:-1))cp.appendChild(chip("Against USD trend",-1));
    sm.appendChild(cp);it.appendChild(sm);
    var d=el("div","det"),hrs=r.since*4;
    var p1=el("p");p1.appendChild(el("b",null,"Trend: "));p1.appendChild(document.createTextNode((r.state=="bull"?"20 EMA above 50 EMA":"20 EMA below 50 EMA")+", crossed "+(hrs<48?hrs+" hours":Math.round(hrs/24)+" days")+" ago. Price "+r.price+(r.ema200?(r.chart[r.chart.length-1]>r.ema200[r.ema200.length-1]?", above the 200 EMA.":", below the 200 EMA."):".")));
    var p2=el("p");p2.appendChild(el("b",null,"COT: "));p2.appendChild(document.createTextNode("net "+fmt(r.cot_net)+(r.cot_share!=null?" ("+fmt(r.cot_share)+"% of open interest)":"")+", "+fmt(r.cot_change)+" this week"+(r.cot_change_1m!=null?", "+fmt(r.cot_change_1m)+" over the month, "+fmt(r.cot_change_3m)+" over the quarter":"")+", "+ord(r.cot_pct)+" percentile of the last 3 years."+(function(){var m=cmom(r);if(m==null)return(function(){var t=ctxtOld(r),s=cdir(r)==1?"long":"short";return t.indexOf("growing")>-1?" The "+s+" is growing.":t.indexOf("shrinking")>-1?" The "+s+" is shrinking.":""})();var cs=cscore(r);return" COT score "+(cs>0?"+":"")+cs.toFixed(2)+" out of \u00b11 (position "+(cpos(r)>0?"+":"")+cpos(r).toFixed(2)+", momentum "+(m>0?"+":"")+m.toFixed(2)+(ccrowd(r)&&cs*ccrowd(r)>0?", trimmed because the position is crowded":"")+")."})()));
    var p3=el("p");p3.appendChild(el("b",null,"Macro: "));
    p3.appendChild(document.createTextNode(r.macro_score==null?"not available for this instrument.":r.macro_score+" out of \u00b1100."+(r.rate_diff!=null?" Rate difference "+fmt(r.rate_diff)+", real rate difference "+fmt(r.real_diff)+"."+(r.econ_diff!=null?" Economy score difference "+fmt(r.econ_diff)+".":""):r.note?" "+r.note+".":"")));
    d.appendChild(p1);d.appendChild(p2);d.appendChild(p3);if(r.strength_gap!=null){var p4=el("p");p4.appendChild(el("b",null,"Strength: "));p4.appendChild(document.createTextNode(r.symbol.slice(0,3)+" ranks "+Math.abs(r.strength_gap)+" places "+(r.strength_gap>0?"above":"below")+" "+r.symbol.slice(3)+" over the last 24 hours. Counts for "+W_STRENGTH+"% of the score."));d.appendChild(p4)}it.appendChild(d);L.appendChild(it)});
  rankView();stampView();dxyView();econView();cotView();
}
function load(txt){try{var d=JSON.parse(txt);if(!d.rows)throw 0;data=d;if(d.thresholds)T=d.thresholds;if(d.cot_neutral!=null)N=d.cot_neutral;render()}catch(e){document.getElementById("stamp").textContent="That file isn\u2019t valid scanner output."}}
document.getElementById("filters").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.m){mk=b.dataset.m;document.querySelectorAll("[data-m]").forEach(function(x){x.setAttribute("aria-pressed",x==b)})}

var fi=document.getElementById("file");if(fi)fi.addEventListener("change",function(e){var f=e.target.files[0];if(f)f.text().then(load)});
function pull(auto){fetch("scanner_results.json",{cache:"no-store"}).then(function(r){return r.ok?r.text():Promise.reject()}).then(function(t){if(auto){try{if(JSON.parse(t).generated==data.generated)return}catch(e){}}load(t)}).catch(function(){})}
